version: 2
models:
  - name: daily_revenue
    description: Daily completed-order revenue by category (cancelled/returned excluded).
    columns:
      - name: order_date
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
      - name: gross_revenue
        data_tests: [not_null]
  - name: customer_metrics
    description: Per-customer completed-order lifetime spend.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: lifetime_value
        data_tests: [not_null]
